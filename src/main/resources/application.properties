# Quarkus application configuration

# Database configuration
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:2881/motily?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&sessionVariables=foreign_key_checks=0
quarkus.datasource.username=root
quarkus.datasource.password=123456
quarkus.datasource.db-kind=mysql
quarkus.datasource.db-version=5.7.0

# Disable Dev Services (use external database)
quarkus.devservices.enabled=false

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.schema-management.enabled=false
quarkus.hibernate-orm.log.sql=true

# Disable schema generation and validation
quarkus.hibernate-orm.schema-generation.database.action=none
quarkus.hibernate-orm.validate-in-dev-mode=false

# Disable foreign key creation
quarkus.hibernate-orm.hibernate.hbm2ddl.auto=none
quarkus.hibernate-orm.hibernate.schema_update.enabled=false
quarkus.hibernate-orm.hibernate.validate.schema=false
quarkus.hibernate-orm.hibernate.ddl-auto=none

# REST configuration
# quarkus.rest.path=/api

# Cache configuration
quarkus.cache.enabled=true

# Health check configuration
quarkus.smallrye-health.enabled=true

# Metrics configuration
quarkus.smallrye-metrics.enabled=true

# LLM configuration
motily.llm.url=http://localhost:8000/v1/generate
motily.llm.api-key=your-api-key
motily.llm.max-tokens=1000

# Application configuration
motily.simulation.population=100000
motily.simulation.max-years=100
motily.simulation.time-granularity=dynamic

# Performance optimization configuration
# Enable fast-jar packaging for faster startup
quarkus.package.jar.type=fast-jar

# Enable HTTP/2 for better performance
quarkus.http.http2=true

# Configure thread pool size
quarkus.vertx.worker-pool-size=16

# Optimize for production
quarkus.profile=prod