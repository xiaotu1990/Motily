# Quarkus application configuration

# Database configuration
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:2881/motily
quarkus.datasource.username=root
quarkus.datasource.password=123456
quarkus.datasource.db-kind=mysql

# Hibernate ORM configuration
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# REST configuration
quarkus.rest.path=/api

# Redis Cache configuration
quarkus.cache.redis.enabled=true
quarkus.cache.redis.hosts=localhost:6379

# Quartz configuration
quarkus.quartz.enabled=true
# Remove store-type property as it's causing issues

# Health check configuration
quarkus.smallrye-health.enabled=true

# Metrics configuration
quarkus.smallrye-metrics.enabled=true

# LLM configuration
motily.llm.url=http://localhost:8000/v1/generate
motily.llm.api-key=your-api-key
motily.llm.max-tokens=1000

# Application configuration
motily.simulation.population=100000
motily.simulation.max-years=100
motily.simulation.time-granularity=dynamic

# Performance optimization configuration
# Enable GraalVM native image support
quarkus.package.type=jar

# Enable fast-jar packaging for faster startup
quarkus.package.jar.type=fast-jar

# Enable HTTP/2 for better performance
quarkus.http.http2=true

# Configure thread pool size
quarkus.vertx.worker-pool-size=16

# Enable caching for REST endpoints
quarkus.cache.enabled=true

# Enable reactive programming support
quarkus.reactive.enabled=true

# Optimize for production
quarkus.profile=prod