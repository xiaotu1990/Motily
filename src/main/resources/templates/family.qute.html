<!DOCTYPE html>
<html>
<head>
    <title>家族管理</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="header"><h1>家族管理</h1></div>
            <div class="main">
                <div v-if="loading" class="message message-info">加载中... <span class="loading"></span></div>
                <div v-if="error" class="message message-error">{{ error }}</div>
                <table class="table" v-if="families.length > 0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>家族名称</th>
                            <th>家族总财富</th>
                            <th>社会影响力</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="family in families" :key="family.id">
                            <td>{{ family.id }}</td>
                            <td>{{ family.name }}</td>
                            <td>{{ family.totalWealth }}</td>
                            <td>{{ family.socialInfluence }}</td>
                        </tr>
                    </tbody>
                </table>
                <div v-else class="empty-state"><p>暂无家族数据</p></div>
            </div>
            <div class="footer">© 2026 Motily</div>
        </div>
    </div>
    <script src="/webjars/vue/dist/vue.global.js"></script>
    <script>
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    families: [],
                    loading: false,
                    error: null
                };
            },
            mounted() {
                this.loadFamilies();
            },
            methods: {
                loadFamilies() {
                    this.loading = true;
                    this.error = null;
                    // 调用家族列表接口
                    fetch('/api/family/list')
                        .then(response => response.json())
                        .then(data => {
                            this.families = data.data || [];
                            this.loading = false;
                        })
                        .catch(error => {
                            console.error('加载家族数据失败', error);
                            // 加载失败时使用模拟数据
                            this.families = [
                                { id: 1, name: '张家', totalWealth: 1000000, socialInfluence: 90 },
                                { id: 2, name: '李家', totalWealth: 800000, socialInfluence: 80 },
                                { id: 3, name: '王家', totalWealth: 600000, socialInfluence: 70 }
                            ];
                            this.error = '加载真实数据失败，显示模拟数据';
                            this.loading = false;
                        });
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
